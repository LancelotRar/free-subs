#机场设置锚点
BaseProvider: &BaseProvider {type: http, interval: 3600, proxy: DIRECT, header: {User-Agent: ['clash.meta', 'clash.verge', 'mihomo']}, override: {additional-prefix: ['[机场名]']}, health-check: {enable: true, interval: 3600, lazy: true, url: 'https://g.cn/generate_204'}}
#过滤器锚点
FilterHK: &FilterHK {filter: '(?i)(港|🇭🇰|(?<![A-Za-z])HK(?![A-Za-z])|Hong|HKG)', icon: 'https://testingcf.jsdelivr.net/gh/LancelotRar/policy-icon-set@main/IconSet/Color/Hong_Kong.png'}
FilterSG: &FilterSG {filter: '(?i)(坡|狮城|🇸🇬|(?<![A-Za-z])SG(?![A-Za-z])|Singapore)', icon: 'https://testingcf.jsdelivr.net/gh/LancelotRar/policy-icon-set@main/IconSet/Color/Singapore.png'}
FilterJP: &FilterJP {filter: '(?i)(日|🇯🇵|(?<![A-Za-z])JP(?![A-Za-z])|Japan)', icon: 'https://testingcf.jsdelivr.net/gh/LancelotRar/policy-icon-set@main/IconSet/Color/Japan.png'}
FilterKR: &FilterKR {filter: '(?i)(韩|🇰🇷|韓|首尔|南朝鲜|(?<![A-Za-z])KR(?![A-Za-z])|KOR|Korea)', icon: 'https://testingcf.jsdelivr.net/gh/LancelotRar/policy-icon-set@main/IconSet/Color/Korea.png'}
FilterUS: &FilterUS {filter: '(?i)(美|🇺🇸|(?<![A-Za-z])US(?![A-Za-z])|USA)', icon: 'https://testingcf.jsdelivr.net/gh/LancelotRar/policy-icon-set@main/IconSet/Color/United_States.png'}
FilterTW: &FilterTW {filter: '(?i)(台|🇹🇼|(?<![A-Za-z])TW(?![A-Za-z])|tai|TPE)', icon: 'https://testingcf.jsdelivr.net/gh/LancelotRar/policy-icon-set@main/IconSet/Color/China.png'}
FilterCFYX: &FilterCFYX {filter: '(?i)(优|优选|域名)', icon: 'https://testingcf.jsdelivr.net/gh/LancelotRar/policy-icon-set@main/IconSet/Color/Siri.png'}
FilterOther: &FilterOther {exclude-filter: '(?i)(港|🇭🇰|(?<![A-Za-z])HK(?![A-Za-z])|Hong|HKG|坡|🇸🇬|(?<![A-Za-z])SG(?![A-Za-z])|Singapore|日|🇯🇵|(?<![A-Za-z])JP(?![A-Za-z])|Japan|韩|🇰🇷|韓|首尔|南朝鲜|(?<![A-Za-z])KR(?![A-Za-z])|KOR|Korea|美|🇺🇸|(?<![A-Za-z])US(?![A-Za-z])|USA|台|🇹🇼|(?<![A-Za-z])TW(?![A-Za-z])|tai|优|优选|域名)', icon: 'https://testingcf.jsdelivr.net/gh/LancelotRar/policy-icon-set@main/IconSet/Color/World_Map.png'}
#DNS代理锚点
BaseDNS: &BaseDNS {type: select, proxies: [自动选择, CF优选, 香港, 日本, 韩国, 美国, 新加坡, 台湾省, 其他节点, 负载均衡, 故障转移]}
#默认策略锚点
UrltestFirst: &UrltestFirst {type: select, proxies: [自动选择, DIRECT, 手动选择, CF优选, 香港, 日本, 韩国, 美国, 新加坡, 台湾省, 其他节点, 负载均衡, 故障转移]}
DirectFirst: &DirectFirst {type: select, proxies: [DIRECT, 自动选择, 手动选择, CF优选, 香港, 日本, 韩国, 美国, 新加坡, 台湾省, 其他节点, 负载均衡, 故障转移]}
RejectFirst: &RejectFirst {type: select, proxies: [REJECT, 自动选择, 手动选择, DIRECT, CF优选, 香港, 日本, 韩国, 美国, 新加坡, 台湾省, 其他节点, 负载均衡, 故障转移]}
#基础策略锚点
BaseUrltest: &BaseUrltest {type: url-test, interval: 1800, lazy: true, timeout: 3000, max-failed-times: 3, empty-fallback: REJECT, include-all: true, tolerance: 200, hidden: true, url: 'https://g.cn/generate_204'}
BaseFallback: &BaseFallback {type: fallback, interval: 1800, lazy: true, timeout: 3000, max-failed-times: 3, empty-fallback: REJECT, include-all: true, hidden: true, url: 'https://g.cn/generate_204'}
BaseLoadbalance: &BaseLoadbalance {type: load-balance, interval: 1800, lazy: true, timeout: 3000, max-failed-times: 3, empty-fallback: REJECT, include-all: true, strategy: sticky-sessions, hidden: true, url: 'https://g.cn/generate_204'}
#规则集锚点
RulesetDN: &RulesetDN {type: http, behavior: domain, proxy: DIRECT, format: mrs, interval: 86400}
RulesetIP: &RulesetIP {type: http, behavior: ipcidr, proxy: DIRECT, format: mrs, interval: 86400}

proxy-providers:
  provider1:
    <<: *BaseProvider
    url: '机场订阅地址1'
    age-secret-key: ''

mode: rule
mixed-port: 7890
port: 7891
socks-port: 7892
redir-port: 7893
tproxy-port: 7894
allow-lan: true
log-level: info
external-controller: 0.0.0.0:9090
bind-address: '*'
external-ui-url: 'https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip'
external-ui-name: 'zashboard'
external-ui: ui
ipv6: false
tcp-concurrent: true
unified-delay: true
find-process-mode: strict
keep-alive-interval: 60
keep-alive-idle: 60

experimental:
  quic-go-disable-gso: true

tun:
  enable: false
  auto-detect-interface: true
  auto-route: true
  strict-route: true
  auto-redirect: true
  device: mihomo
  disable-icmp-forwarding: true
  dns-hijack:
    - 0.0.0.0:53
  stack: mixed

dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:1053
  cache-algorithm: arc
  use-hosts: true
  respect-rules: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter: ['rule-set:private', 'rule-set:fakeip-filter']
  default-nameserver: ['223.5.5.5#DIRECT', '119.29.29.29#DIRECT']
  proxy-server-nameserver: ['https://dns.alidns.com/dns-query#DIRECT', 'https://doh.pub/dns-query#DIRECT']
  nameserver: ['https://dns.google/dns-query#DNS防泄露', 'https://doh.opendns.com/dns-query#DNS防泄露']
  nameserver-policy:
    'rule-set:geolocation-cn': ['https://dns.alidns.com/dns-query#DIRECT', 'https://doh.pub/dns-query#DIRECT']
  direct-nameserver: ['223.6.6.6#DIRECT', '119.29.29.29#DIRECT']

hosts:
  'dns.alidns.com': ['223.5.5.5', '223.6.6.6']
  'doh.pub': ['1.12.12.12', '120.53.53.53']
  'dns.google': ['8.8.8.8', '8.8.4.4']
  'dns.cloudflare.com': ['1.1.1.1', '1.0.0.1']
  'doh.opendns.com': ['208.67.222.222', '208.67.220.220']
  'services.googleapis.cn': 'services.googleapis.com'

profile:
  store-selected: true
  store-fake-ip: true

ntp:
  enable: true
  write-to-system: false
  server: 'ntp.aliyun.com'
  port: 123
  interval: 60

proxy-groups:
  - {name: 打包代理, <<: *UrltestFirst, icon: 'https://testingcf.jsdelivr.net/gh/LancelotRar/policy-icon-set@main/IconSet/Color/Rocket.png'}
  - {name: 打包直连, <<: *DirectFirst, icon: 'https://testingcf.jsdelivr.net/gh/LancelotRar/policy-icon-set@main/IconSet/Color/Daily.png'}
  - {name: 漏网之鱼, <<: *DirectFirst, icon: 'https://testingcf.jsdelivr.net/gh/LancelotRar/policy-icon-set@main/IconSet/Color/Drill.png'}
  - {name: 自动选择, <<: *BaseUrltest, icon: 'https://testingcf.jsdelivr.net/gh/LancelotRar/policy-icon-set@main/IconSet/Color/LinkCube.png'}
  - {name: 手动选择, type: select, include-all: true, icon: 'https://testingcf.jsdelivr.net/gh/LancelotRar/policy-icon-set@main/IconSet/Color/Clubhouse.png'}
  - {name: 负载均衡, <<: *BaseLoadbalance, icon: 'https://testingcf.jsdelivr.net/gh/LancelotRar/policy-icon-set@main/IconSet/Color/friDay.png'}
  - {name: 故障转移, <<: *BaseFallback, icon: 'https://testingcf.jsdelivr.net/gh/LancelotRar/policy-icon-set@main/IconSet/Color/Bypass.png'}
  - {name: 广告拦截, <<: *RejectFirst, icon: 'https://testingcf.jsdelivr.net/gh/LancelotRar/policy-icon-set@main/IconSet/Color/AdBlack.png'}

  - {name: DNS防泄露, <<: *BaseDNS, icon: 'https://testingcf.jsdelivr.net/gh/LancelotRar/policy-icon-set@main/IconSet/Color/Cellular.png'}
  - {name: Cloudflare, <<: *UrltestFirst, icon: 'https://testingcf.jsdelivr.net/gh/LancelotRar/policy-icon-set@main/IconSet/Color/Cloudflare.png'}
  - {name: Opencode, <<: *DirectFirst, icon: 'https://testingcf.jsdelivr.net/gh/LancelotRar/policy-icon-set@main/IconSet/Additional/Opencode.png'}
  - {name: AgentRouter, <<: *UrltestFirst, icon: 'https://testingcf.jsdelivr.net/gh/LancelotRar/policy-icon-set@main/IconSet/Additional/Agentrouter.png'}

  - {name: CF优选, <<: *FilterCFYX, type: select, include-all: true, proxies: [CF优选-自动, CF优选-故转]}
  - {name: 香港, <<: *FilterHK, type: select, include-all: true, proxies: [香港-自动, 香港-故转]}
  - {name: 日本, <<: *FilterJP, type: select, include-all: true, proxies: [日本-自动, 日本-故转]}
  - {name: 韩国, <<: *FilterKR, type: select, include-all: true, proxies: [韩国-自动, 韩国-故转]}
  - {name: 美国, <<: *FilterUS, type: select, include-all: true, proxies: [美国-自动, 美国-故转]}
  - {name: 新加坡, <<: *FilterSG, type: select, include-all: true, proxies: [新加坡-自动, 新加坡-故转]}
  - {name: 台湾省, <<: *FilterTW, type: select, include-all: true, proxies: [台湾省-自动, 台湾省-故转]}
  - {name: 其他节点, <<: *FilterOther, type: select, include-all: true, proxies: [其他节点-自动, 其他节点-故转]}

  - {name: CF优选-自动, <<: [*BaseUrltest, *FilterCFYX]}
  - {name: 香港-自动, <<: [*BaseUrltest, *FilterHK]}
  - {name: 日本-自动, <<: [*BaseUrltest, *FilterJP]}
  - {name: 韩国-自动, <<: [*BaseUrltest, *FilterKR]}
  - {name: 美国-自动, <<: [*BaseUrltest, *FilterUS]}
  - {name: 新加坡-自动, <<: [*BaseUrltest, *FilterSG]}
  - {name: 台湾省-自动, <<: [*BaseUrltest, *FilterTW]}
  - {name: 其他节点-自动, <<: [*BaseUrltest, *FilterOther]}

  - {name: CF优选-故转, <<: [*BaseFallback, *FilterCFYX]}
  - {name: 香港-故转, <<: [*BaseFallback, *FilterHK]}
  - {name: 日本-故转, <<: [*BaseFallback, *FilterJP]}
  - {name: 韩国-故转, <<: [*BaseFallback, *FilterKR]}
  - {name: 美国-故转, <<: [*BaseFallback, *FilterUS]}
  - {name: 新加坡-故转, <<: [*BaseFallback, *FilterSG]}
  - {name: 台湾省-故转, <<: [*BaseFallback, *FilterTW]}
  - {name: 其他节点-故转, <<: [*BaseFallback, *FilterOther]}

