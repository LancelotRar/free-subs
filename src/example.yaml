baseProvider: &baseProvider {type: http, interval: 3600, proxy: DIRECT, header: {User-Agent: ['clash.meta', 'clash.verge', 'mihomo']}, override: {additional-prefix: ['[***]']}, health-check: {enable: true, interval: 3600, lazy: true, url: 'https://www.gstatic.com/generate_204'}}
filterHK: &filterHK {filter: '(?i)(港|🇭🇰|(?<![A-Za-z])HK(?![A-Za-z])|Hong|HKG)'}
filterSG: &filterSG {filter: '(?i)(坡|🇸🇬|(?<![A-Za-z])SG(?![A-Za-z])|Sing|SIN|XSP)'}
filterJP: &filterJP {filter: '(?i)(日|🇯🇵|(?<![A-Za-z])JP(?![A-Za-z])|Japan|NRT|HND|KIX|CTS|FUK)'}
filterKR: &filterKR {filter: '(?i)(韩|🇰🇷|韓|首尔|南朝鲜|(?<![A-Za-z])KR(?![A-Za-z])|KOR|Korea|South)'}
filterUS: &filterUS {filter: '(?i)(美|🇺🇸|(?<![A-Za-z])US(?![A-Za-z])|USA|SJC|JFK|LAX|ORD|ATL|DFW|SFO|MIA|SEA|IAD)'}
filterTW: &filterTW {filter: '(?i)(台|🇹🇼|(?<![A-Za-z])TW(?![A-Za-z])|tai|TPE|TSA|KHH)'}
filterOther: &filterOther {exclude-filter: '(?i)(港|🇭🇰|(?<![A-Za-z])HK(?![A-Za-z])|Hong|HKG|坡|🇸🇬|(?<![A-Za-z])SG(?![A-Za-z])|Sing|SIN|XSP|日|🇯🇵|(?<![A-Za-z])JP(?![A-Za-z])|Japan|NRT|HND|KIX|CTS|FUK|韩|🇰🇷|韓|首尔|南朝鲜|(?<![A-Za-z])KR(?![A-Za-z])|KOR|Korea|South|美|🇺🇸|(?<![A-Za-z])US(?![A-Za-z])|USA|SJC|JFK|LAX|ORD|ATL|DFW|SFO|MIA|SEA|IAD|台|🇹🇼|(?<![A-Za-z])TW(?![A-Za-z])|tai|TPE|TSA|KHH)'}
preferUrltest: &preferUrltest {proxies: [🍀自动选择, DIRECT, 🫱手动选择, REJECT, 🇭🇰香港, 🇯🇵日本, 🇰🇷韩国, 🇺🇸美国, 🇸🇬新加坡, 🇨🇳台湾省, ⚽️其他节点, ⚖️负载均衡, ⚙️故障切换]}
preferDirect: &preferDirect {proxies: [DIRECT, 🍀自动选择, 🫱手动选择, REJECT, 🇭🇰香港, 🇯🇵日本, 🇰🇷韩国, 🇺🇸美国, 🇸🇬新加坡, 🇨🇳台湾省, ⚽️其他节点, ⚖️负载均衡, ⚙️故障切换]}
preferReject: &preferReject {proxies: [REJECT, 🍀自动选择, 🫱手动选择, DIRECT, 🇭🇰香港, 🇯🇵日本, 🇰🇷韩国, 🇺🇸美国, 🇸🇬新加坡, 🇨🇳台湾省, ⚽️其他节点, ⚖️负载均衡, ⚙️故障切换]}
baseDns: &baseDns {proxies: [🍀自动选择, 🇭🇰香港, 🇯🇵日本, 🇰🇷韩国, 🇺🇸美国, 🇸🇬新加坡, 🇨🇳台湾省, ⚽️其他节点]}
baseSelect: &baseSelect {type: select, interval: 3600, lazy: true, timeout: 3000, max-failed-times: 3, empty-fallback: REJECT, hidden: false, url: 'https://www.gstatic.com/generate_204'}
baseUrltest: &baseUrltest {type: url-test, interval: 3600, lazy: true, timeout: 3000, max-failed-times: 3, empty-fallback: REJECT, include-all: true, tolerance: 200, hidden: true, url: 'https://www.gstatic.com/generate_204'}
baseFallback: &baseFallback {type: fallback, interval: 3600, lazy: true, timeout: 3000, max-failed-times: 3, empty-fallback: REJECT, include-all: true, hidden: true, url: 'https://www.gstatic.com/generate_204'}
baseLoadbalance: &baseLoadbalance {type: load-balance, interval: 3600, lazy: true, timeout: 3000, max-failed-times: 3, empty-fallback: REJECT, include-all: true, strategy: sticky-sessions, hidden: true, url: 'https://www.gstatic.com/generate_204'}
rulesetDN: &rulesetDN {type: http, behavior: domain, proxy: DIRECT, format: mrs, interval: 86400}
rulesetIP: &rulesetIP {type: http, behavior: ipcidr, proxy: DIRECT, format: mrs, interval: 86400}

proxy-providers:
  provider1:
    <<: *baseProvider
    url: https://
    age-secret-key: ''

mode: rule
mixed-port: 7890
port: 7891
socks-port: 7892
redir-port: 7893
tproxy-port: 7894
allow-lan: true
log-level: info
external-controller: 0.0.0.0:9090
bind-address: '*'
external-ui-url: 'https://gh-proxy.org/https://github.com/Zephyruso/zashboard/releases/latest/download/dist.zip'
external-ui-name: zashboard
external-ui: ui
ipv6: false
tcp-concurrent: true
unified-delay: true
find-process-mode: strict
keep-alive-interval: 15
keep-alive-idle: 600

experimental:
  quic-go-disable-gso: true

tun:
  enable: false
  auto-detect-interface: true
  auto-route: true
  strict-route: true
  auto-redirect: true
  device: mihomo
  disable-icmp-forwarding: true
  dns-hijack:
    - 0.0.0.0:53
  stack: mixed

dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:1053
  cache-algorithm: arc
  use-hosts: true
  respect-rules: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter: ['rule-set:private']
  default-nameserver: ['223.5.5.5#DIRECT', '119.29.29.29#DIRECT']
  proxy-server-nameserver: ['https://dns.alidns.com/dns-query#DIRECT', 'https://doh.pub/dns-query#DIRECT']
  nameserver: ['https://dns.google/dns-query#🪛DNS防泄露', 'https://doh.opendns.com/dns-query#🪛DNS防泄露']
  nameserver-policy:
    'rule-set:geolocation-cn': ['https://dns.alidns.com/dns-query#DIRECT', 'https://doh.pub/dns-query#DIRECT']
  direct-nameserver: ['223.6.6.6#DIRECT', '119.29.29.29#DIRECT']

hosts:
  'dns.alidns.com': ['223.5.5.5', '223.6.6.6']
  'doh.pub': ['1.12.12.12', '120.53.53.53']
  'dns.google': ['8.8.8.8', '8.8.4.4']
  'dns.cloudflare.com': ['1.1.1.1', '1.0.0.1']
  'doh.opendns.com': ['208.67.222.222', '208.67.220.220']
  'services.googleapis.cn': 'services.googleapis.com'

profile:
  store-selected: true
  store-fake-ip: true

proxy-groups:
  - name: 🚀打包代理
    <<: [*baseSelect, *preferUrltest]

  - name: ☀️打包直连
    <<: [*baseSelect, *preferDirect]

  - name: 🐠漏网之鱼
    <<: [*baseSelect, *preferDirect]

  - name: 🍀自动选择
    <<: *baseUrltest

  - name: 🫱手动选择
    <<: *baseSelect
    include-all: true

  - name: ⚖️负载均衡
    <<: *baseLoadbalance

  - name: ⚙️故障切换
    <<: *baseFallback

  - name: ❗️广告拦截
    <<: [*baseSelect, *preferReject]

  - name: 🪛DNS防泄露
    <<: [*baseSelect, *baseDns]

  - name: ☁️Cloudflare
    <<: [*baseSelect, *preferDirect]

  - name: 🇭🇰香港
    <<: [*baseSelect, *filterHK]
    include-all: true
    proxies: [🇭🇰香港-自动选择]

  - name: 🇭🇰香港-自动选择
    <<: [*baseUrltest, *filterHK]

  - name: 🇯🇵日本
    <<: [*baseSelect, *filterJP]
    include-all: true
    proxies: [🇯🇵日本-自动选择]

  - name: 🇯🇵日本-自动选择
    <<: [*baseUrltest, *filterJP]

  - name: 🇰🇷韩国
    <<: [*baseSelect, *filterKR]
    include-all: true
    proxies: [🇰🇷韩国-自动选择]

  - name: 🇰🇷韩国-自动选择
    <<: [*baseUrltest, *filterKR]

  - name: 🇺🇸美国
    <<: [*baseSelect, *filterUS]
    include-all: true
    proxies: [🇺🇸美国-自动选择]

  - name: 🇺🇸美国-自动选择
    <<: [*baseUrltest, *filterUS]

  - name: 🇸🇬新加坡
    <<: [*baseSelect, *filterSG]
    include-all: true
    proxies: [🇸🇬新加坡-自动选择]

  - name: 🇸🇬新加坡-自动选择
    <<: [*baseUrltest, *filterSG]

  - name: 🇨🇳台湾省
    <<: [*baseSelect, *filterTW]
    include-all: true
    proxies: [🇨🇳台湾省-自动选择]

  - name: 🇨🇳台湾省-自动选择
    <<: [*baseUrltest, *filterTW]

  - name: ⚽️其他节点
    <<: [*baseSelect, *filterOther]
    include-all: true
    proxies: [⚽️其他节点-自动选择]

  - name: ⚽️其他节点-自动选择
    <<: [*baseUrltest, *filterOther]

