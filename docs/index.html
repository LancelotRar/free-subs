<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>利群公益</title>
    <meta name="description" content="利群公益频道主页——关注 Telegram 频道获取免费订阅服务与最新动态。" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <meta name="theme-color" content="#1d1d1f" />
    <link rel="preload" as="image" href="background-mobile.webp" media="(max-width: 768px)" fetchpriority="high" />
    <link rel="preload" as="image" href="background-pc.webp" media="(min-width: 769px)" fetchpriority="high" />
  <style>
    /* ===== CSS Custom Properties ===== */
    :root {
      --bg-color: #f5f5f7;
      --text-color: #1d1d1f;
      --subtext-color: #6e6e73;
      --card-bg: #ffffff;
      --btn-bg: #e8e8ed;
      --btn-hover-bg: #d1d1d6;
      --accent-color: #0071e3;
    }

    /* ===== Global Styles ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      position: relative;
    }

    /* ===== Fixed Background Layers (crossfade on scroll) =====
       position:fixed divs are used INSTEAD of background-attachment:fixed,
       which is broken on iOS Safari. Both desktop and mobile get the
       scroll crossfade this way. */
    .bg-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      /* Fixed height instead of inset:0 — a dynamic viewport (mobile URL bar
         collapsing) would otherwise resize the layer and make `cover` re-scale,
         causing a visible size jump mid-scroll. lvh stays constant. */
      height: 100vh;
      height: 100lvh;
      z-index: -1;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      pointer-events: none;
    }

    .bg-1 {
      background-image: url('background-pc.webp');
    }

    /* .bg-2 has no background-image here on purpose: it is invisible at first
       paint, so the image is injected by JS (bottom of file) once the page is
       idle or the user starts scrolling — keeping it out of the initial load. */
    .bg-2 {
      opacity: 0;
      will-change: opacity;
    }

    /* ===== Scroll Hint (bottom of hero) ===== */
    .scroll-hint {
      position: absolute;
      bottom: 2.5rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
      color: #ffffff;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .scroll-hint:hover {
      color: #34c759;
    }

    .scroll-hint-mouse {
      width: 24px;
      height: 38px;
      border: 2px solid currentColor;
      border-radius: 14px;
      position: relative;
    }

    .scroll-hint-mouse::after {
      content: '';
      position: absolute;
      top: 7px;
      left: 50%;
      width: 4px;
      height: 7px;
      margin-left: -2px;
      border-radius: 2px;
      background: currentColor;
      animation: scroll-wheel 1.8s ease-in-out infinite;
    }

    .scroll-hint-text {
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.25em;
      margin-right: -0.25em;
    }

    @keyframes scroll-wheel {
      0% { opacity: 1; transform: translateY(0); }
      65% { opacity: 0; transform: translateY(11px); }
      66% { opacity: 0; transform: translateY(-1px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .scroll-hint-mouse::after,
      h1,
      h1::after {
        animation: none;
      }
    }

    /* ===== Hero Section ===== */
    .hero {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      z-index: 1;
    }

    /* ===== Registration Section (Centered Flex) ===== */
    .registration {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 1;
      padding: 4rem 2rem;
      max-width: 1100px;
      margin: 0 auto;
      text-align: center;
    }

    /* ===== Shared Content Styles ===== */
    .container {
      text-align: center;
      padding: 2rem;
    }

    h1 {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      font-size: 6rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      letter-spacing: 0.03em;
      margin-right: -0.03em;
      position: relative;
      -webkit-text-stroke: 6px #ffffff;
      paint-order: stroke fill;
      text-shadow: 10px 12px 8px rgba(0, 0, 0, 0.3);
      animation: hero-title-in 0.7s cubic-bezier(0.22, 1, 0.36, 1) backwards;
    }

    /* Looping diagonal shine sweep, clipped to the glyphs */
    h1::after {
      content: attr(data-text);
      /* Alternative-text syntax hides the decorative duplicate from screen readers */
      content: attr(data-text) / "";
      position: absolute;
      inset: 0;
      color: transparent;
      -webkit-text-stroke: 0;
      background-image: linear-gradient(
        115deg,
        transparent 40%,
        rgba(255, 255, 255, 0.9) 50%,
        transparent 60%
      );
      background-repeat: no-repeat;
      background-size: 250% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      animation: title-shine 3s ease-in-out infinite;
      pointer-events: none;
    }

    @keyframes title-shine {
      0% { background-position: 120% 0; }
      45% { background-position: -20% 0; }
      100% { background-position: -20% 0; }
    }

    @keyframes hero-title-in {
      from {
        opacity: 0;
        transform: translateY(24px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ===== Telegram Link (CTA) ===== */
    .telegram-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      width: 230px;
      height: 62px;
      background: var(--card-bg);
      color: var(--text-color);
      border: 1px solid var(--btn-bg);
      border-radius: 38px;
      font-size: 1.8rem;
      line-height: 1;
      font-weight: 500;
      text-decoration: none;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
      transition: background-color 0.2s ease, transform 0.2s ease;
    }

    .telegram-link:hover {
      background: var(--btn-hover-bg);
      transform: translateY(-2px);
    }

    .telegram-link svg {
      width: 36px;
      height: 36px;
      fill: var(--text-color);
      transform: translate(-5px, 0);
    }

    /* ===== Responsive (MUST stay last — overrides base rules above) ===== */
    @media (max-width: 768px) {
      h1 {
        font-size: clamp(3rem, 17vw, 4.5rem);
        -webkit-text-stroke-width: 4px;
        white-space: nowrap;
      }

      .registration {
        padding: 2rem 1rem;
      }

      /* Portrait wallpapers on small screens (crossfade layers stay active).
         .bg-2's portrait source is chosen by JS at injection time. */
      .bg-1 {
        background-image: url('background-mobile.webp');
      }
    }
  </style>
</head>
<body>
  <!-- Fixed background layers: bg-2 fades in as the user scrolls -->
  <div class="bg-layer bg-1"></div>
  <div class="bg-layer bg-2"></div>

  <main>
  <section class="hero">
    <div class="container">
      <h1 data-text="利群公益">利群公益</h1>
    </div>

    <!-- Scroll Hint -->
    <a class="scroll-hint" href="#registration">
      <span class="scroll-hint-mouse" aria-hidden="true"></span>
      <span class="scroll-hint-text">向下滑动</span>
    </a>
  </section>

  <section class="registration" id="registration">
    <!-- Channel CTA -->
    <a
      class="telegram-link"
      href="https://t.me/liqunchannel"
      target="_blank"
      rel="noopener noreferrer"
    >
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/>
      </svg>
      关注频道
    </a>
  </section>
  </main>

  <script>
    // ===== Scroll Crossfade: bg-1 → bg-2 =====
    const bgScroll = document.querySelector('.bg-2');
    const scrollHint = document.querySelector('.scroll-hint');
    const mqMobile = window.matchMedia('(max-width: 768px)');

    // Cached viewport height. Mobile browsers change innerHeight when the URL
    // bar collapses; recomputing on every scroll would make the crossfade rate
    // jump mid-gesture. Only a real resize (rotation) refreshes it.
    let viewportH = window.innerHeight;

    // ---- Second wallpaper: deferred load ----
    // It is fully transparent at first paint, so it must not compete with the
    // first wallpaper for bandwidth. Injected on first scroll or when idle.
    let bg2Requested = false;

    function bg2Source() {
      return mqMobile.matches ? 'background2-mobile.webp' : 'background2-pc.webp';
    }

    function loadBg2() {
      if (bg2Requested) return;
      bg2Requested = true;
      bgScroll.style.backgroundImage = "url('" + bg2Source() + "')";
    }

    // Swap portrait/landscape source if the breakpoint changes after loading
    mqMobile.addEventListener('change', function () {
      if (bg2Requested) {
        bgScroll.style.backgroundImage = "url('" + bg2Source() + "')";
      }
    });

    function updateBgOpacity() {
      const scrollY = window.scrollY;
      const progress = Math.min(scrollY / viewportH, 1);
      bgScroll.style.opacity = progress;

      // Fade out scroll hint as soon as the user starts scrolling
      if (scrollHint) {
        const hintProgress = Math.min(scrollY / 120, 1);
        scrollHint.style.opacity = String(1 - hintProgress);
        scrollHint.style.visibility = hintProgress >= 1 ? 'hidden' : 'visible';
      }
    }

    // rAF-throttled: coalesces bursts of scroll events into one style write
    // per frame, so low-end devices never thrash layout mid-gesture.
    let framePending = false;

    function onScroll() {
      loadBg2();
      if (framePending) return;
      framePending = true;
      requestAnimationFrame(function () {
        framePending = false;
        updateBgOpacity();
      });
    }

    window.addEventListener('scroll', onScroll, { passive: true });
    window.addEventListener('resize', function () {
      // Ignore small deltas (URL bar show/hide), react to real layout changes
      if (Math.abs(window.innerHeight - viewportH) > 120) {
        viewportH = window.innerHeight;
        updateBgOpacity();
      }
    }, { passive: true });
    updateBgOpacity();

    // Warm the second wallpaper only after the page has loaded, and then only
    // while the browser is idle — so it never competes with the first paint.
    window.addEventListener('load', function () {
      if ('requestIdleCallback' in window) {
        requestIdleCallback(loadBg2, { timeout: 3000 });
      } else {
        setTimeout(loadBg2, 800);
      }
    });

    // Smooth-scroll to the next section on hint click.
    // Explicit JS scrolling ignores the OS "reduced motion" setting,
    // so it stays smooth on every device.
    document.querySelector('.scroll-hint').addEventListener('click', function(e) {
      e.preventDefault();
      document.getElementById('registration').scrollIntoView({ behavior: 'smooth' });
    });
  </script>
</body>
</html>
